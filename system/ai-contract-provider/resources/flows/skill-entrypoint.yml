flow:
  id: 'skill-entrypoint'
  description: 'Serve the mercury-platform Agent Skill entrypoint (SKILL.md)'
  ttl: 10s

first.task: 'v1.reference.reader'

tasks:
  # the same reference reader serves SKILL.md - only the input mapping differs
  - input:
      - 'text(SKILL.md) -> path'
    process: 'v1.reference.reader'
    output:
      - 'result.type -> output.header.content-type'
      - 'result.content -> output.body'
    description: 'Read the packaged SKILL.md'
    execution: end
