first.task: 'v1.contract.list'

tasks:
  - input: []
    process: 'v1.contract.list'
    output:
      - 'text(application/json) -> output.header.content-type'
      - 'result -> output.body'
    description: 'Enumerate contract ids and summaries from the catalog'
    execution: end
