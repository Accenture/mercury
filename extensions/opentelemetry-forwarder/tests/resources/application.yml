# Configuration of the pipeline suite (tests/trace_pipeline.rs): forwarding ON,
# pointed at the in-process collector double. No REST server - this suite binds
# no fixed port (the Java and Rust suites share the well-known ones).
application.name: otel-forwarder-test
log.format: text
# Master switch. Default is FALSE: linking the crate is not enough, the operator
# opts in per environment. This suite exercises the forwarder, so it is on.
otel.forwarding: true
# Plain values, not ${OTEL_*} references (see resources-exporter/application.yml)
otel.exporter.otlp.endpoint: '${OTEL_FWD_TEST_ENDPOINT:http://127.0.0.1:1/v1/traces}'
otel.service.name: mercury-otel-demo
# a placeholder credential: the suite asserts it reaches the collector verbatim
otel.exporter.otlp.headers: 'Authorization=Api-Token test-token'
# accepted for parity, only `none` is honoured on this engine (a warning says so)
otel.exporter.otlp.compression: gzip
