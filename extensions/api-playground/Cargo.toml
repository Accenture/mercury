[package]
name = "api-playground"
description = "The API playground - Swagger UI in a Mercury page, the twin of the Java extensions/api-playground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# an application, not a library release artifact - never publish to crates.io
publish = false

[dependencies]
mercury-platform-core = { path = "../../crates/platform-core" }
async-trait = "0.1"
serde_json = "1"
log = "0.4"
rmpv = "1"

[dev-dependencies]
# one temporary folder per test process, removed when the process exits (dev-only)
mercury-test-support = { path = "../../crates/test-support" }
