#
# Test configuration for the streaming-rest e2e suite (Java parity: the
# sync-over-async test application.properties). The REST automation file and
# port are set programmatically per suite (yaml.rest.automation / a port-0
# rest.server.port override); redis.* connection values are constructed
# directly against each test's own in-process RESP double.
#
# The sync.* return-route engine tunables are listed here explicitly (at their
# code defaults) to document the configurable surface for the reader — the
# same six keys, same defaults, as the Java engine (wire-format parity).
#
application.name=sync-over-async-e2e
sync.return.channel.prefix=svc-return
sync.route.ttl.seconds=90
sync.response.ttl.seconds=30
sync.max.pending.requests=10000
sync.stream.ttl.seconds=1800
sync.max.pending.streams=1000
