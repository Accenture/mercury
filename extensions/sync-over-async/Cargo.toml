[package]
name = "mercury-sync-over-async"
description = "Cross-pod progressive rendering for Mercury: a Redis-backed streaming return route (import from the application, never the engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["redis", "streaming", "sse", "progressive", "mercury"]
categories = ["asynchronous", "web-programming"]

[lib]
name = "sync_over_async"

[dependencies]
mercury-platform-core = { version = "4.12.19", path = "../../crates/platform-core" }
# the shared Redis client foundation (configuration, standalone-or-cluster
# seam, health probe) - extracted from this crate, lock-step with the Java engine
mercury-redis-connection = { version = "4.12.19", path = "../redis-connection" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

uuid = { version = "1", features = ["v4"] }
rmpv = { version = "1", features = ["with-serde"] }

[dev-dependencies]
mercury-redis-test-double = { path = "../redis-test-double" }
# the MVP end-to-end suite drives the facade tasks over the Kafka flow adapter
# (mock cluster) and the flow engine, by configuration alone
mercury-minimalist-kafka = { path = "../../crates/minimalist-kafka" }
mercury-event-script = { path = "../../crates/event-script" }
rdkafka = { version = "0.38", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
