[package]
name = "mercury-sync-over-async"
description = "Cross-pod progressive rendering for Mercury: a Redis-backed streaming return route (import from the application, never the engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["redis", "streaming", "sse", "progressive-rendering", "mercury"]
categories = ["asynchronous", "web-programming"]

[lib]
name = "sync_over_async"

[dependencies]
mercury-platform-core = { version = "4.12.7", path = "../../crates/platform-core" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

[dev-dependencies]
mercury-redis-test-double = { path = "../../crates/redis-test-double" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }
