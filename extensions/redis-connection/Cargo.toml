[package]
name = "mercury-redis-connection"
description = "Shared Redis client foundation for Mercury's Redis-backed extensions: prefix-parameterised configuration, the standalone-or-cluster connection seam and the reusable health probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["redis", "cluster", "health-check", "connection", "mercury"]
categories = ["database", "asynchronous"]

[lib]
name = "redis_connection"

[dependencies]
mercury-platform-core = { version = "4.12.12", path = "../../crates/platform-core" }
async-trait = "0.1"
log = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "cluster-async"] }

[dev-dependencies]
mercury-redis-test-double = { path = "../redis-test-double" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
