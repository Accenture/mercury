[package]
name = "mercury-graph-packager"
description = "Pack, unpack and inspect MiniGraph graph sets with the engine's canonical packager (RFC-0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# a command-line tool built with the workspace, not a library release artifact - whether it
# is published to crates.io is a release decision, so it stays out of `cargo publish --workspace`
publish = false

[lib]
name = "graph_packager"
path = "src/lib.rs"

[[bin]]
name = "graph-packager"
path = "src/main.rs"

[dependencies]
# the packager is the engine's: the canonical package (platform-core), the deployment gate's
# checks and the graph-set rules (knowledge-graph), and the JSON reader (event-script)
mercury-platform-core = { path = "../../crates/platform-core" }
mercury-knowledge-graph = { path = "../../crates/knowledge-graph" }
mercury-event-script = { path = "../../crates/event-script" }
rmpv = { version = "1", features = ["with-serde"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
