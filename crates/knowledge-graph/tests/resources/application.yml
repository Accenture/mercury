#
# Test configuration for the knowledge-graph crate — mirrors the keys the
# Java engine's src/test/resources/application.properties sets for the
# CompileGraph tests (rest.server.port feeds the ${rest.server.port}
# substitution inside graph fixtures such as hellojs.json).
#
application.name: 'knowledge-graph-test'
info.app:
  version: '1.0.0'
  description: 'Knowledge graph compiler tests'

# dev environment so the Playground services + dev mocks (now #[optional_service(
# "app.env=dev")]) register — the API-fetcher tests call the mocks over HTTP, and
# the ws services trigger the HTTP server start.
app.env: dev

rest.server.port: 8090

# Event-over-HTTP declarative map for the graph.task foreign-route pin
# (graph_runtime.rs); the stub peer binds stub.peer.port in the test
yaml.event.over.http: 'classpath:/event-over-http.yaml'
stub.peer.port: 8391

location.graph.temp: 'file:/tmp/graph'
# the manifest carries the location of its own models ('location' entry,
# default classpath:/graph) - location.graph.deployed is obsolete
graph.model.automation: 'classpath:/graphs.yaml'
