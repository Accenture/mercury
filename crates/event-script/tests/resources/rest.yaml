#
# Test REST endpoints for the http-client flow fixtures (Java parity):
# the echo endpoint returns what it received on the wire.
#
rest:
  - service: "echo.endpoint"
    methods: ['POST', 'GET']
    url: "/api/echo/{demo}"
    timeout: 10s
    tracing: true

  - service: "http.flow.adapter"
    methods: ['POST']
    url: "/api/http/client/by/config/{demo}"
    flow: 'http-client-by-config'
    timeout: 10s
    tracing: true

  - service: "http.flow.adapter"
    methods: ['GET']
    url: "/api/timeout/{user}"
    flow: 'timeout-test'
    timeout: 10s
    tracing: true

  # Rust-side supplement (Increment 211): the flow reads the request's cookies
  # and, on the first endpoint, the session values its authentication function set
  - service: "http.flow.adapter"
    methods: ['GET']
    url: "/api/cookie/session/{user}"
    flow: 'input-cookie-session'
    authentication: "v1.session.auth"
    timeout: 10s
    tracing: true

  - service: "http.flow.adapter"
    methods: ['GET']
    url: "/api/cookie/open/{user}"
    flow: 'input-cookie-session'
    timeout: 10s
    tracing: true
