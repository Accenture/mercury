[package]
name = "mercury-event-script"
description = "Rust port of mercury-composable event-script-engine — layer 2, composable orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["orchestration", "workflow", "event-driven", "yaml", "mercury"]
categories = ["asynchronous"]

[lib]
name = "event_script"

[dependencies]
mercury-platform-core = { version = "4.12.2", path = "../platform-core" }
async-trait = "0.1"
log = "0.4"
# --- increment E-2: data-mapping engine ---
# rmpv is the bus currency (envelope bodies) — the flow state machine uses it
# directly so state<->envelope moves need no conversion (byte-fidelity like
# Java's Object tree); serde_json + serde_json_path serve the `$.…` JSONPath
# view (user-defined complex queries — maintainer decision 2026-07-16)
rmpv = { version = "1", features = ["with-serde"] }
serde_json = "1"
serde_json_path = "0.7"
base64 = "0.22"
chrono = "0.4"
# increment 53 (parity F5): f:dateTime zone argument — chrono-tz is the
# ZoneId.of() analog (IANA database), iana-time-zone names the system zone
# (the ZoneId.systemDefault() analog, same crate chrono uses internally)
chrono-tz = "0.10"
iana-time-zone = "0.1"
mercury-event-script-macros = { version = "4.12.2", path = "../event-script-macros" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# compile-fail guards for the macro surfaces (tests/ui)
trybuild = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
