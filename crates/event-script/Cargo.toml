[package]
name = "mercury-event-script"
description = "Rust port of mercury-composable event-script-engine — layer 2, composable orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["orchestration", "workflow", "event-driven", "yaml", "mercury"]
categories = ["asynchronous"]

[lib]
name = "event_script"

[dependencies]
mercury-platform-core = { version = "4.12.30", path = "../platform-core" }
async-trait = "0.1"
log = "0.4"
# --- increment E-2: data-mapping engine ---
# rmpv is the bus currency (envelope bodies) — the flow state machine uses it
# directly so state<->envelope moves need no conversion (byte-fidelity like
# Java's Object tree); serde_json + serde_json_path serve the `$.…` JSONPath
# view (user-defined complex queries — maintainer decision 2026-07-16)
rmpv = { version = "1", features = ["with-serde"] }
serde_json = "1"
serde_json_path = "0.7"
base64 = "0.22"
# dates, times and zones (increment 207: jiff replaces chrono, chrono-tz and iana-time-zone,
# which RustSec lists as unmaintained): f:dateTime's zone argument is jiff::tz::TimeZone::get
# (the ZoneId.of() analog, the IANA database) and TimeZone::system() names the system zone
# (the ZoneId.systemDefault() analog); tzdb-bundle-always keeps a copy of the database for a
# container without /usr/share/zoneinfo, the system's copy winning where it exists
jiff = { version = "1", features = ["tzdb-bundle-always"] }
mercury-event-script-macros = { version = "4.12.30", path = "../event-script-macros" }
uuid = { version = "1", features = ["v4"] }
# RFC-0001 / ADR-0025: exact decimal arithmetic for the f:decimal* plugins and the DECIMAL statement
bigdecimal = "0.4"

[dev-dependencies]
# compile-fail guards for the macro surfaces (tests/ui)
trybuild = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# one temporary folder per test process, removed when the process exits (dev-only)
mercury-test-support = { path = "../test-support" }
