flow:
  id: 'kafka-ingest'
  description: 'records one Kafka message dataset for the e2e assertions'
  ttl: 10s

first.task: 'kafka.sink.task'

tasks:
  - name: 'kafka.sink.task'
    input:
      - 'input.header -> record_header'
      - 'input.metadata -> metadata'
      - 'input.body -> body'
    process: 'kafka.sink.task'
    output: []
    description: 'capture the dataset'
    execution: end
