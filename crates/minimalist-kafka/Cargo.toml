[package]
name = "mercury-minimalist-kafka"
description = "Opt-in Kafka building blocks for Mercury: publish events to topics (simple.kafka.notification) and route topics into Event Script flows, with externalized client templates and a kafka.health probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["kafka", "event-driven", "flow-adapter", "composable", "mercury"]
categories = ["asynchronous"]

[lib]
name = "minimalist_kafka"

[features]
default = []
# SASL_SSL / SCRAM / OAUTHBEARER connectivity: builds librdkafka with vendored
# OpenSSL (Kerberos/GSSAPI is deliberately not wired here - add it when a
# deployment actually needs it)
ssl = ["rdkafka/ssl-vendored"]

[dependencies]
mercury-platform-core = { version = "4.12.17", path = "../platform-core" }
mercury-event-script = { version = "4.12.17", path = "../event-script" }
async-trait = "0.1"
log = "0.4"
regex = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
rdkafka = { version = "0.38", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
# --- Schema Registry (the Confluent wire format for JSON Schema and Avro values) ---
# the Apache Avro reference implementation for Rust: schema parsing + binary datum encode/decode
apache-avro = "0.22"
# JSON Schema validation only (no remote $ref retrieval, no aws-lc TLS - the workspace stays on ring)
jsonschema = { version = "0.56", default-features = false }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
# the in-process Confluent-compatible registry double (tests/support)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
