[package]
name = "kafka-demo"
description = "Example application — the minimalist-kafka worked example: the Kafka flow adapter in both routing styles plus simple.kafka.notification (twin of the Java kafka-demo)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# not a library release artifact - never publish to crates.io
publish = false

[dependencies]
mercury-platform-core = { path = "../../crates/platform-core" }
mercury-event-script = { path = "../../crates/event-script" }
mercury-minimalist-kafka = { path = "../../crates/minimalist-kafka" }
async-trait = "0.1"
serde_json = "1"
rmpv = { version = "1", features = ["with-serde"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
