# hello-flow example — event-script (layer 2) riding platform-core (layer 1).
# The structural parallel of the Java composable-example (same port 8100).
application.name: hello-flow

# structured logging (increment 5): text = plain console line (default),
# json = pretty-print JSON, compact = single-line jsonl (no CR/LF per record).
# Both JSON forms carry the app-log-context block. Override at launch with the
# -D runtime argument (the JVM -D analog): hello_flow -- -Dlog.format=compact
log.format: json

# REST automation serves rest.yaml; the flow engine loads flows.yaml — both
# by their default locations in this resources/ folder.
rest.automation: true
rest.server.port: 8100

info.app.description: 'mercury hello-flow example (event-script)'
show.application.properties: 'application.name, rest.server.port'
mandatory.health.dependencies: 'flow.engine.health'

# Event-over-HTTP demo peer (the callee of both demo endpoints): the Rust
# hello-world example or the Java lambda-example — both serve port 8085 with
# the same public routes, so they are interchangeable.
yaml.event.over.http: 'classpath:/event-over-http.yaml'
peer.demo.host: '127.0.0.1'
peer.demo.port: 8085

# Shared demo secret for the Event-over-HTTP authentication demo. The called
# party's "event.api.auth" service expects this value in the "authorization"
# header. Resolved from the DEMO_PEER_TOKEN environment variable so no real
# credential is ever hard-coded ("demo" is the fallback for local development
# only). The declarative side reads the same variable in event-over-http.yaml.
demo.peer.token: '${DEMO_PEER_TOKEN:demo}'

# --- OpenTelemetry trace forwarder (mercury-opentelemetry-forwarder) ---
# Master switch - DEFAULT OFF. The crate is linked, but with this false the route
# `distributed.trace.forwarder` does not exist and the app runs exactly as before.
# DevOps turns it on per environment, or at launch without a rebuild:
#   cargo run -p hello-flow -- -Dotel.forwarding=true
otel.forwarding: false
# The endpoint and the credential come from the environment - nothing hard-coded.
# Backends differ in the header NAME and in whether the value carries an auth
# scheme. OTLP_AUTH_HEADER carries both vendor-specific parts in literal HTTP
# header syntax, so OTLP_TOKEN stays the bare secret. Dynatrace:
#   export OTLP_API_ENDPOINT="https://<tenant>/api/v2/otlp/v1/traces"
#   export OTLP_AUTH_HEADER="Authorization: Api-Token"   # lint:allow-secret-material - header NAME and scheme only, no token
#   export OTLP_TOKEN="<your-api-token>"
# Splunk Observability Cloud:
#   export OTLP_API_ENDPOINT="https://ingest.<realm>.signalfx.com/v2/trace/otlp"
#   export OTLP_AUTH_HEADER="X-SF-Token:"
#   export OTLP_TOKEN="<your-access-token>"
# Unset variables resolve to nothing: the built-in default endpoint and no header.
otel.exporter.otlp.endpoint: '${OTLP_API_ENDPOINT}'
otel.exporter.otlp.headers: '${OTLP_AUTH_HEADER} ${OTLP_TOKEN}'
# How traces are grouped in the backend. Deliberately OTLP_-prefixed, not the
# OpenTelemetry standard OTEL_SERVICE_NAME, which instrumented hosts often export
# machine-wide (a leaked value would rename this app's traces).
otel.service.name: '${OTLP_SERVICE_NAME:hello-flow}'
