#
# Declarative Event-over-HTTP targets: routes that live on polyglot peers.
#
# The support-triage demo graph's AI node (llm.chat) and the /api/llm/stream relay's
# target (llm.stream) are functions in the LLM helper app: mercury-nodejs's
# examples/llm-helper (default port 8087) or mercury-python's examples/llm-helper
# (port 8086). Run one with ANTHROPIC_API_KEY exported in its environment:
#
#     node dist/src/cli.js examples/llm-helper/llm-helper.mjs    (mercury-nodejs)
#     mercury-serve examples/llm-helper/llm_helper.py            (mercury-python)
#
# Point at another peer with -Dllm.peer.host / -Dllm.peer.port overrides; the graph
# names a route, not a provider, and does not change.
#
event.http:
  - route: 'llm.chat'
    target: 'http://${llm.peer.host:127.0.0.1}:${llm.peer.port:8087}/api/event'
  - route: 'llm.stream'
    target: 'http://${llm.peer.host:127.0.0.1}:${llm.peer.port:8087}/api/event'
