# minigraph-playground example — active knowledge graph (layer 3) on
# event-script (layer 2) on platform-core (layer 1).
application.name: minigraph-playground

# REST automation serves rest.yaml + the static webapp bundle; app.env=dev
# turns on the dev-gated Playground services (each declared with
# #[optional_service("app.env=dev")]). Env-overridable (Java parity:
# ${APP_ENV:dev}) — set APP_ENV=prod to run graphs only through
# POST /api/graph/{graph-id}, with the Playground UI/WS/mocks not loaded.
app.env: ${APP_ENV:dev}
rest.automation: true
rest.server.port: 8085

# Playground draft-graph scratch folder (Java parity: file:/tmp/graph).
location.graph.temp: file:/tmp/graph

# Hot deploy and undeploy of graph sets (RFC-0017) - both switches OFF by default.
# Either switch on makes the engine read the hot deployment folder at startup and on demand:
# graph.hot.deploy registers POST /api/graph-set/deploy, graph.hot.undeploy registers
# POST /api/graph-set/undeploy/{graph-id}; GET /api/graph-set/deployed answers under either.
# The folder must be a file:/ folder the application can write, outside the temp folder above
# and outside every manifest's 'unpack' folder; mount it as a persistent volume to survive a restart.
# graph.hot.deploy.throttle is the least time in ms between two reads of a set's record (0 = every lookup).
graph.hot.deploy: false
graph.hot.undeploy: false
location.graph.deploy: file:/tmp/deploy
# graph.hot.deploy.throttle: 0

# The graph manifest — the CompileGraph deployment gate. A deployed graph is
# executable at POST /api/graph/{graph-id} only when listed in the manifest
# AND passing the gate ("compiled or 404"); the manifest carries the location
# of its own models in its 'location' entry (the flows.yaml convention —
# location.graph.deployed is obsolete).
graph.model.automation: 'classpath:/graphs.yaml'
# routes that live on polyglot peers (the support-triage graph's AI node, the llm.stream relay's target)
yaml.event.over.http: 'classpath:/event-over-http.yaml'

# Stepwise traversal logging for deployed graph execution (graph.executor) —
# the same trail the Playground dry-run narrates, as INFO structured records
# {id, text, graph} where id is the trace id (fallback: flow instance id) so
# OTel dashboards can join logs with spans; log.format=json/compact embed the
# record as indexable key-values. Set to false
# (e.g. -Dgraph.traversal.log=false) to reduce log noise. Java parity.
graph.traversal.log: true

# Serializer null handling (Java parity). Default false: null MAP key-values are
# omitted from JSON and MsgPack output (e.g. a successful /sync response drops the
# null `error` field), mirroring Gson's default + MsgPack packMap null-skip.
# Rationale: PoJos rarely initialize every field, so their nulls are output noise;
# omitting them keeps the payload clean. Set true when a downstream must tell
# "key present with null value" from "key absent". Only map key-values are
# affected — array elements (including nulls) are always kept so ordering is
# preserved, and an empty [] or {} is a real value, never treated as null.
serializer.null.transport: false

# The diagram-assistant demo stores the rendered SVG and a page that inlines it under this folder
# (diagram.render keeps the image out of band and gives the model a reference).
diagram.store.folder: /tmp/rendered_diagrams

info.app.description: 'mercury MiniGraph Playground (active knowledge graph)'
show.application.properties: 'application.name, app.env, rest.server.port'
