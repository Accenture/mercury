# The graph manifest — the CompileGraph deployment gate (Java parity).
# Every graph model listed here is validated and compiled at startup; a
# deployed graph is executable at POST /api/graph/{graph-id} ONLY when it is
# listed here AND passes the gate. A graph that fails, or is not listed,
# answers HTTP-404 as if it does not exist (the CompileFlows precedent).
graphs:
  - 'tutorial-1'
  # the agent-orchestration experiment E0 (bounded-agency support triage): its llm.chat
  # node is a function on the LLM helper app (a python or node host) reached through
  # event-over-http.yaml
  - 'support-triage'
  # the agent loop of RFC-0011 (llm.run): a supervised write through suspend and resume on Redis
  - 'order-assistant'
  # an MCP server's tool in the loop's catalog, through diagram.render and the pack's MCP binding
  - 'diagram-assistant'
  # the built-in agent tools of RFC-0013 (a language pack's extensions/agent-tools): a crawl and a
  # supervised write of the notes; a document of corpus/ extracted into the knowledge graph (mode: auto);
  # the graph queried with the sources cited
  - 'site-notes'
  - 'document-ingest'
  - 'document-query'

#
# Graph set is optional
# ---------------------
#
# To illustrate use of "graph sets",
# tutorial-2 to 14 are deployed in packed format under resources/graph/tutorials.pack.
# (tutorial-13 fetches a profile from this app's own dev mock endpoint; tutorial-14 is
# the suspend/resume purchase workflow - see 'help tutorial 14')
#
# The "unpack" folder is "/tmp/unpack".
#
sets:
  - 'tutorials'

# like flows.yaml, the manifest carries the location of its own models
# (tutorial-1 travels with the knowledge-graph engine's resources)
location: 'classpath:/graph'

unpack: 'file:/tmp/unpack'
