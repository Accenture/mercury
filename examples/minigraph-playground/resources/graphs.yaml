# The graph manifest — the CompileGraph deployment gate (Java parity).
# Every graph model listed here is validated and compiled at startup; a
# deployed graph is executable at POST /api/graph/{graph-id} ONLY when it is
# listed here AND passes the gate. A graph that fails, or is not listed,
# answers HTTP-404 as if it does not exist (the CompileFlows precedent).
graphs:
  - 'tutorial-1'
  - 'tutorial-2'
  - 'tutorial-3'
  - 'tutorial-4'
  - 'tutorial-5'
  - 'tutorial-6'
  - 'tutorial-7'
  - 'tutorial-8'
  - 'tutorial-9'
  - 'tutorial-10'
  - 'tutorial-11'
  - 'tutorial-12'
  # tutorial-13: graph.task as an HTTP client by configuration - async.http.request fetches a
  # profile from this app's own dev mock endpoint (/api/mdm/profile/{id} in rest.yaml, app.env=dev)
  - 'tutorial-13'
  # tutorial-14: the suspend/resume purchase workflow (three checkpoints, four
  # runs, one business correlation id) - see 'help tutorial 14' and the
  # workflow-suspension guide
  - 'tutorial-14'
  # the agent-orchestration experiment E0 (bounded-agency support triage): its llm.chat
  # node is a function on the LLM helper app (a python or node host) reached through
  # event-over-http.yaml
  - 'support-triage'

# like flows.yaml, the manifest carries the location of its own models
# (the tutorials travel with the knowledge-graph engine's resources)
location: 'classpath:/graph'
