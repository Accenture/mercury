[package]
name = "sync-over-async-demo"
description = "Example application — cross-pod progressive rendering over the streaming return route (stream-ui / stream-producer roles)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# not a library release artifact - never publish to crates.io
publish = false

[dependencies]
mercury-platform-core = { path = "../../crates/platform-core" }
mercury-sync-over-async = { path = "../../extensions/sync-over-async" }
async-trait = "0.1"
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }
