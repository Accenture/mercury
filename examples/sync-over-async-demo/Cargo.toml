[package]
name = "sync-over-async-demo"
description = "Example application — synchronous REST over an asynchronous Kafka backend with the Redis return route (facade / backend roles, raw, JSON Schema and Avro legs) and cross-pod progressive rendering over the streaming return route (stream-ui / stream-producer roles)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# not a library release artifact - never publish to crates.io
publish = false

[dependencies]
mercury-platform-core = { path = "../../crates/platform-core" }
mercury-event-script = { path = "../../crates/event-script" }
mercury-sync-over-async = { path = "../../extensions/sync-over-async" }
mercury-minimalist-kafka = { path = "../../crates/minimalist-kafka" }
async-trait = "0.1"
serde_json = "1"
rmpv = { version = "1", features = ["with-serde"] }
log = "0.4"
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
