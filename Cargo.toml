[workspace]
resolver = "2"
members = [
    "crates/platform-core",
    "crates/platform-macros",
    "crates/event-script",
    "crates/event-script-macros",
    "crates/knowledge-graph",
    "crates/knowledge-graph-macros",
    "extensions/minigraph-state-redis",
    "benchmark/benchmark-reporter",
    "system/ai-contract-provider",
    "examples/hello-world",
    "examples/hello-flow",
    "examples/minigraph-playground",
    # starter templates for the three layers (copy one out to begin a new
    # project; explicit metadata - no workspace inheritance - so a copy
    # builds as-is, listed here so every build proves they stay current)
    "templates/starter-function",
    "templates/starter-flow",
    "templates/starter-graph",
]

[workspace.package]
version = "4.12.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Accenture/mercury"
