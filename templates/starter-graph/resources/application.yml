# starter-graph - Layer 3 starter configuration
application.name: starter-graph
info.app.description: 'Layer 3 starter - Active Knowledge Graph as the application'

# REST automation serves rest.yaml over HTTP
rest.automation: true
# a distinct port so a running application never collides with unit tests
rest.server.port: 8303

# CompileGraph quality gate (required for deployed graph execution) - validates
# and compiles the manifest-listed graph models at startup; only graphs that
# pass the gate are executable ("compiled or 404")
graph.model.automation: 'classpath:/graphs.yaml'

# Hot deploy and undeploy of graph sets (RFC-0017) - both switches OFF by default. Either switch on makes
# the engine read the hot deployment folder at startup and on demand: graph.hot.deploy registers
# POST /api/graph-set/deploy, graph.hot.undeploy registers POST /api/graph-set/undeploy/{graph-id};
# GET /api/graph-set/deployed answers under either. The folder must be a file:/ folder the application can
# write, outside location.graph.temp and every manifest's 'unpack' folder; mount it as a persistent volume.
# scripts/deploy-graph-set.mjs and scripts/undeploy-graph-set.mjs drive the entries from a pipeline.
graph.hot.deploy: false
graph.hot.undeploy: false
location.graph.deploy: file:/tmp/deploy

# Dev mode - activates the MiniGraph Playground UI, the WebSocket session and the AI
# companion endpoint, so you can co-author graph models with an AI agent or by hand.
# Every one of those services is gated by #[optional_service("app.env=dev")]; the matching
# rest.yaml entries are skipped when the gate is closed, and the home page (get.index.html)
# then serves a plain service page instead of the Playground UI. Remove this line for production.
app.env: dev
