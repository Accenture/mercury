#
# REST automation - deployed graphs are executed through the engine's
# graph-executor flow; only manifest-listed graphs that pass the CompileGraph
# gate respond (anything else is HTTP-404, as if nonexistent).
#
rest:
  - service: "http.flow.adapter"
    methods: ['POST', 'GET']
    url: "/api/graph/{graph_id}"
    flow: 'graph-executor'
    timeout: 30s
    tracing: true

  # The home page (also reached at "/"). get.index.html serves the MiniGraph Playground
  # web app when app.env=dev and a plain service page otherwise, so a production
  # deployment never shows the Playground UI. Without this entry "/" falls through to
  # the engine crate's static index.html, which is the same plain page in both modes.
  - service: 'get.index.html'
    methods: ['GET']
    url: '/index.html'
    timeout: 10s

# Below endpoints for minigraph-playground, tutorials and AI companion.
# They are not loaded when app.env not = dev or absent.
  - service: 'show.graph.model'
    methods: ['GET']
    url: '/api/graph/model/{graph_id}/{sequence}'
    timeout: 30s
    tracing: true

  - service: 'get.live.graph'
    methods: ['GET']
    url: '/api/graph/session/{id}'
    timeout: 30s
    tracing: true

  - service: 'upload.json.content'
    methods: ['POST']
    url: '/api/json/content/{id}'
    timeout: 30s
    tracing: true

  - service: 'upload.mock.content'
    methods: ['POST']
    url: '/api/mock/{id}'
    timeout: 30s
    tracing: true

  - service: 'import.graph.content'
    methods: ['POST']
    url: '/api/graph/import/{id}'
    timeout: 30s
    tracing: true

  - service: 'pack.graph.set'
    methods: ['POST']
    url: '/api/graph-set/pack'
    timeout: 30s
    tracing: true

  # The OpenAPI 3.0 document of a deployed graph model (RFC-0007): a YAML attachment by default,
  # ?format=json for JSON inline, ?view=contract for the derived contract with its evidence
  - service: 'get.graph.openapi'
    methods: ['GET']
    url: '/api/openapi/{graph_id}'
    timeout: 30s
    tracing: true

  # The same document for the session's draft graph
  - service: 'get.graph.openapi'
    methods: ['GET']
    url: '/api/openapi/session/{sessionId}'
    timeout: 30s
    tracing: true

  - service: 'unpack.graph.set'
    methods: ['POST']
    url: '/api/graph-set/unpack'
    timeout: 30s
    tracing: true

  # Hot deploy and undeploy of graph sets (RFC-0017), registered only when graph.hot.deploy / graph.hot.undeploy is on.
  # The body of a deploy is the graph set (.pack) as application/octet-stream; an optional X-Graph-Set-SHA256
  # header is the digest the caller expects. A set is named after its main graph, which is the undeploy path.
  - service: 'deploy.graph.set'
    methods: ['POST']
    url: '/api/graph-set/deploy'
    timeout: 60s
    tracing: true

  - service: 'undeploy.graph.set'
    methods: ['POST']
    url: '/api/graph-set/undeploy/{graph_id}'
    timeout: 30s
    tracing: true

  - service: 'list.deployed.sets'
    methods: ['GET']
    url: '/api/graph-set/deployed'
    timeout: 30s
    tracing: true

  - service: 'inspect.state.machine'
    methods: ['GET']
    url: '/api/inspect/{id}/{key}'
    timeout: 30s
    tracing: true

  # THE companion endpoint (ADR-0008, synchronous) - returns the command outcome
  # in-band as {ok, id, command, output, error, result} and tees every line to the
  # session's WebSocket console.
  - service: 'post.companion.command.sync'
    methods: ['POST']
    url: '/api/companion/{id}/sync'
    timeout: 30s
    tracing: true

  # MOCK endpoints (dev-only engine services the tutorials call over HTTP)

  - service: 'mock.mdm.profile'
    methods: ['POST']
    url: '/api/mdm/profile'
    timeout: 10s
    tracing: true

  - service: 'mock.mdm.profile'
    methods: ['GET']
    url: '/api/mdm/profile/{id}'
    timeout: 10s
    tracing: true

  - service: 'mock.account.details'
    methods: ['POST']
    url: '/api/account/details'
    timeout: 10s
    tracing: true
